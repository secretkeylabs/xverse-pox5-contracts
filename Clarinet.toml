[project]
name = "xverse-pox5-contracts"
description = "Clarity smart contracts for Xverse PoX-5 integrations"
authors = []
telemetry = false
cache_dir = "./.cache"
requirements = [
    { contract_id = 'SM3VDXK3WZZSA84XXFKAFAF15NNZX32CTSG82JFQ4.sbtc-deposit' }
]

[repl.analysis]
